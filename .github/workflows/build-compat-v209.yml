name: 构建兼容测试包

on:
  push:
    branches:
      - chatgpt/compat-0.2.974-v209
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 授予 Gradle Wrapper 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 上传 Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XiaoAiTypeUnblock-v209-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
