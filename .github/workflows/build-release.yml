name: 构建正式安装包

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: 准备正式签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::请先在仓库 Settings > Secrets and variables > Actions 中配置 $name。"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      - name: 运行单元测试并构建签名 Release APK
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: 校验签名并整理安装包
        id: package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          source = Path("app/build/outputs/apk/release")
          metadata = json.loads((source / "output-metadata.json").read_text())
          element, = metadata["elements"]
          version = element["versionName"]
          safe_version = re.sub(r"[^A-Za-z0-9._-]", "_", version)
          build = os.environ["BUILD_NUMBER"]
          sha = os.environ["GITHUB_SHA"]
          build_id = f"build-{build}-{sha[:8]}"
          filename = f"XiaoAiTypeUnblock-{safe_version}-{build_id}.apk"
          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          shutil.copyfile(source / element["outputFile"], dist / filename)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"build_id={build_id}\n")
          PY
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: 上传正式安装包
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: XiaoAiTypeUnblock-${{ steps.package.outputs.build_id }}-release
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: 显示安装包下载链接
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### 正式安装包已构建"
            echo "[下载 APK 和 SHA-256 校验文件]($ARTIFACT_URL)（保留 90 天）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清理临时签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
